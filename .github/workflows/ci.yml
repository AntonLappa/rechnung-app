name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rechnung
          POSTGRES_USER: rechnung
          POSTGRES_PASSWORD: rechnung
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rechnung"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        env:
          DB_URL: jdbc:postgresql://localhost:5432/rechnung
          DB_USERNAME: rechnung
          DB_PASSWORD: rechnung
        run: ./mvnw clean verify
