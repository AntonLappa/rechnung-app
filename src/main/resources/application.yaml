spring:
  application:
    name: rechnung-app
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  # ==================== DataSource ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rechnung}
    username: ${DB_USERNAME:rechnung}
    password: ${DB_PASSWORD:rechnung}
    driver-class-name: org.postgresql.Driver

  # ==================== JPA / Hibernate ====================
  jpa:
    hibernate:
      ddl-auto: none  # Liquibase manages schema exclusively
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ==================== Liquibase ====================
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# ==================== App ====================
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}  # Override via JWT_SECRET env var in production
    expiration: 86400000  # 24 hours in milliseconds
  storage:
    endpoint: ${ENDPOINT:}
    access-key: ${ACCESS_KEY_ID:}
    secret-key: ${SECRET_ACCESS_KEY:}
    bucket: ${RAILWAY_BUCKET_NAME:}
    region: ${REGION:us-east-1}

# ==================== Server ====================
server:
  port: 8080
  forward-headers-strategy: framework

# ==================== Logging ====================
logging:
  level:
    com.antonlappa.rechnungapp: INFO
    org.springframework.security: WARN
    org.liquibase: INFO
