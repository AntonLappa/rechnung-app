spring:
  application:
    name: rechnung-app
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}

  # ==================== DataSource ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rechnung}
    username: ${DB_USERNAME:rechnung}
    password: ${DB_PASSWORD:rechnung}
    driver-class-name: org.postgresql.Driver

  # ==================== JPA / Hibernate ====================
  jpa:
    hibernate:
      ddl-auto: none  # Flyway manages schema exclusively
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ==================== Liquibase ====================
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# ==================== JWT Configuration ====================
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}  # Override via JWT_SECRET env var in production
    expiration: 86400000  # 24 hours in milliseconds

# ==================== Server ====================
server:
  port: 8080
  forward-headers-strategy: framework

# ==================== Logging ====================
logging:
  level:
    com.antonlappa.rechnungapp: INFO
    org.springframework.security: WARN
    org.liquibase: INFO
